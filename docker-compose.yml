# docker-compose.yml


services:

  # --- Serveur Web ---
  nginx:
    image: nginx:alpine          # image officielle légère
    ports:
      - "8080:80"                # ton PC:8080 → conteneur:80
    volumes:
      - .:/var/www               # ton code est partagé avec le conteneur
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php                      # nginx démarre après php

  # --- PHP + Laravel ---
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www               # même partage de code
    depends_on:
      - mysql

  # --- Base de données ---
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql  # données persistantes (ne disparaissent pas)
    ports:
      - "3306:3306"

  # --- Interface graphique pour la BDD (bonus !) ---
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

# Volumes nommés (Docker gère leur stockage)
volumes:
  mysql_data: